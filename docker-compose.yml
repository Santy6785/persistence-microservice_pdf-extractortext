services:
  persistence:
    build: .
    env_file:
      - .env
    environment:
      MONGODB_URI: "${MONGODB_URI:?Set MONGODB_URI in .env to the external MongoDB connection string}"
      MONGODB_DB: "${MONGODB_DB:-persistence_db}"
      MONGODB_COLLECTION: "${MONGODB_COLLECTION:-documents}"
      MAX_PAYLOAD_SIZE_BYTES: "${MAX_PAYLOAD_SIZE_BYTES:-14680064}"
    expose:
      - "8000"
    stop_signal: SIGTERM
    stop_grace_period: 10s
    networks:
      - pdf-extractortext_pdf-network
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  pdf-extractortext_pdf-network:
    external: true
